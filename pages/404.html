<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://accounts.google.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://oauth2.googleapis.com https://www.googleapis.com; frame-ancestors 'none'; frame-src https://accounts.google.com/;">
    <title>404 - Sayfa Bulunamadı | MATRIXCHEATS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #050505;
            color: #e0e0e0;
            min-height: 100vh;
            overflow: hidden;
        }
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .error-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 12rem;
            font-weight: 900;
            color: #ff0040;
            text-shadow: 0 0 50px rgba(255,0,64,0.8), 0 0 100px rgba(255,0,64,0.4);
            line-height: 1;
            animation: glitch 2s infinite;
        }
        .error-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #00ff41;
            margin: 20px 0;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0,255,65,0.5);
        }
        .error-desc {
            font-size: 1.1rem;
            color: #808080;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .error-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff0040 0%, #b3002d 100%);
            color: #fff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 5px;
            transition: all 0.3s ease;
            border: 2px solid #ff0040;
        }
        .error-btn:hover {
            box-shadow: 0 0 30px rgba(255,0,64,0.6);
            transform: translateY(-3px);
        }
        .matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-5px, 2px); }
            94% { transform: translate(5px, -2px); }
            96% { transform: translate(-3px, 1px); }
            98% { transform: translate(3px, -1px); }
        }
        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.5rem; }
            .error-desc { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">◈ SİSTEM HATASI ◈</h1>
        <p class="error-desc">
            Aradığınız sayfa bulunamadı veya taşınmış olabilir. 
            Ana sayfaya dönerek aramaya devam edebilirsiniz.
        </p>
        <a href="../index.html" class="error-btn">◈ ANA SAYFA ◈</a>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        
        const drops = [];
        for(let i = 0; i < columns; i++) {
            drops[i] = 1;
        }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff0040';
            ctx.font = fontSize + 'px monospace';
            
            for(let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;
                
                if (Math.random() > 0.95) {
                    ctx.fillStyle = '#00ff41';
                } else {
                    ctx.fillStyle = '#ff0040';
                }
                
                ctx.fillText(char, x, y);
                
                if(y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 50);
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>

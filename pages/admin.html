<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://accounts.google.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://oauth2.googleapis.com https://www.googleapis.com; frame-ancestors 'none'; frame-src https://accounts.google.com/;">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel - MATRIXCHEATS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firebase.googleapis.com">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer crossorigin="anonymous"></script>
</head>
<body>
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-panel">
            <div class="admin-sidebar">
                <div class="admin-logo">
                    <span>◈</span> ADMIN PANEL
                </div>
                <nav class="admin-nav">
                    <button class="admin-nav-item active" onclick="showAdminSection('dashboard')">📊 Dashboard</button>
                    <button class="admin-nav-item" onclick="showAdminSection('products')">🎮 Ürünler</button>
                    <button class="admin-nav-item" onclick="showAdminSection('orders')">📦 Siparişler</button>
                    <button class="admin-nav-item" onclick="showAdminSection('users')">👥 Kullanıcılar</button>
                </nav>
                <div style="margin-top: auto;">
                    <button class="admin-nav-item" onclick="closeAdmin()">❌ Çıkış</button>
                </div>
            </div>
            <div class="admin-content">
                <div class="admin-header">
                    <h1 class="admin-title">Dashboard</h1>
                    <button class="admin-close" onclick="closeAdmin()">✕ Kapat</button>
                </div>
                
                <div class="admin-section active" id="dashboard">
                    <div class="admin-stats">
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Toplam Sipariş</div>
                            <div class="admin-stat-value" id="statOrders">0</div>
                        </div>
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Bekleyen Sipariş</div>
                            <div class="admin-stat-value" id="statPending">0</div>
                        </div>
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Toplam Kullanıcı</div>
                            <div class="admin-stat-value" id="statUsers">0</div>
                        </div>
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Toplam Gelir</div>
                            <div class="admin-stat-value" id="statRevenue">₺0</div>
                        </div>
                    </div>
                </div>
                
                <div class="admin-section" id="products">
                    <div class="quick-actions">
                        <button class="btn-save" onclick="addNewProduct()">➕ Yeni Ürün Ekle</button>
                        <button class="btn-save danger" onclick="saveAllAdminProducts()">💾 Tüm Değişiklikleri Kaydet</button>
                    </div>
                    <div id="productsEditList"></div>
                </div>
                
                <div class="admin-section" id="orders">
                    <div class="orders-list" id="ordersList"></div>
                </div>
                
                <div class="admin-section" id="users">
                    <div class="orders-list" id="usersList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/firebase.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/pages.js" defer></script>
    <script src="../js/admin.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAdminData();
        });
    </script>
</body>
</html>

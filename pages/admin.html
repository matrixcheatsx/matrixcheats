<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com; frame-ancestors 'none';">
    <title>Admin Panel - MATRIXCHEATS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
    <style>
        :root {
            --primary: #00ff41;
            --primary-dark: #00cc33;
            --primary-glow: rgba(0, 255, 65, 0.5);
            --secondary: #0d0d0d;
            --bg-dark: #050505;
            --bg-card: #0a0a0a;
            --text: #e0e0e0;
            --text-muted: #808080;
            --border: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-dark);
            color: var(--text);
        }
        .admin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: none;
        }
        .admin-overlay.active {
            display: block;
        }
        .admin-panel {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 100%;
        }
        .admin-sidebar {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .admin-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--primary);
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-nav-item {
            padding: 15px 20px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            border-radius: 5px;
        }
        .admin-nav-item:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .admin-nav-item.active {
            background: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
        }
        .admin-content {
            padding: 30px;
            overflow-y: auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .admin-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--primary);
        }
        .admin-close {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s ease;
        }
        .admin-close:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }
        .admin-section {
            display: none;
        }
        .admin-section.active {
            display: block;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .admin-stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 8px;
        }
        .admin-stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .admin-stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--primary);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .data-table th,
        .data-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table th {
            background: rgba(0, 255, 65, 0.1);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
        }
        .data-table td {
            color: var(--text);
            font-size: 0.9rem;
        }
        .data-table tr:hover td {
            background: rgba(0, 255, 65, 0.05);
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        .status-completed {
            background: rgba(0, 255, 65, 0.2);
            color: var(--primary);
        }
        .status-cancelled {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }
        .action-btn {
            padding: 8px 15px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            margin-right: 5px;
        }
        .action-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }
        .action-btn.danger {
            border-color: #ff5252;
            color: #ff5252;
        }
        .action-btn.danger:hover {
            background: #ff5252;
            color: white;
        }
        .product-edit-card {
            background: transparent;
            border: 1px solid var(--border);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .product-edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .product-edit-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--text);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        .admin-form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .admin-form-group label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .admin-form-group input,
        .admin-form-group textarea {
            padding: 12px 15px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s ease;
        }
        .admin-form-group input:focus,
        .admin-form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
        }
        .admin-form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn-save {
            background: var(--primary);
            border: none;
            color: var(--bg-dark);
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-save:hover {
            background: var(--primary-dark);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .order-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .order-id {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
        }
        .order-date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .order-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 15px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .order-detail-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .order-detail-item span {
            color: var(--text);
        }
        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .quick-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (max-width: 1024px) {
            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .form-row, .form-row-3 {
                grid-template-columns: 1fr;
            }
            .order-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-panel">
            <div class="admin-sidebar">
                <div class="admin-logo">
                    <span>◈</span> ADMIN PANEL
                </div>
                <nav class="admin-nav">
                    <button class="admin-nav-item active" onclick="showAdminSection('dashboard')">📊 Dashboard</button>
                    <button class="admin-nav-item" onclick="showAdminSection('products')">🎮 Ürünler</button>
                    <button class="admin-nav-item" onclick="showAdminSection('orders')">📦 Siparişler</button>
                    <button class="admin-nav-item" onclick="showAdminSection('users')">👥 Kullanıcılar</button>
                </nav>
                <div style="margin-top: auto;">
                    <button class="admin-nav-item" onclick="closeAdmin()">❌ Çıkış</button>
                </div>
            </div>
            <div class="admin-content">
                <div class="admin-header">
                    <h1 class="admin-title">Dashboard</h1>
                    <button class="admin-close" onclick="closeAdmin()">✕ Kapat</button>
                </div>
                
                <div class="admin-section active" id="dashboard">
                    <div class="admin-stats">
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Toplam Sipariş</div>
                            <div class="admin-stat-value" id="statOrders">0</div>
                        </div>
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Bekleyen Sipariş</div>
                            <div class="admin-stat-value" id="statPending">0</div>
                        </div>
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Toplam Kullanıcı</div>
                            <div class="admin-stat-value" id="statUsers">0</div>
                        </div>
                        <div class="admin-stat-card">
                            <div class="admin-stat-label">Toplam Gelir</div>
                            <div class="admin-stat-value" id="statRevenue">₺0</div>
                        </div>
                    </div>
                </div>
                
                <div class="admin-section" id="products">
                    <div class="quick-actions">
                        <button class="btn-save" onclick="addNewProduct()">➕ Yeni Ürün Ekle</button>
                        <button class="btn-save" style="background: #ff5252;" onclick="saveAllProducts()">💾 Tüm Değişiklikleri Kaydet</button>
                    </div>
                    <div id="productsEditList"></div>
                </div>
                
                <div class="admin-section" id="orders">
                    <div class="orders-list" id="ordersList"></div>
                </div>
                
                <div class="admin-section" id="users">
                    <div class="orders-list" id="usersList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, icon: '🎮', title: 'VALORANT CHEAT', desc: 'En güncel VALORANT hile yazılımı', features: ['Aimbot', 'Wallhack', 'Skin Changer', 'Triggerbot'], prices: { day: 49, week: 149, month: 299 } },
            { id: 2, icon: '⚔️', title: 'CS2 CHEAT', desc: 'Counter-Strike 2 için premium çözümler', features: ['ESP', 'Aim Assistance', 'Skin Mod', 'Bhop'], prices: { day: 59, week: 179, month: 349 } },
            { id: 3, icon: '🏀', title: 'NBA 2K24 CHEAT', desc: 'NBA 2K24 için özel yapım', features: ['Skill Unlock', 'VC Generator', 'Stats Edit'], prices: { day: 39, week: 99, month: 199 } },
            { id: 4, icon: '🏎️', title: 'EA FC 24 CHEAT', desc: 'EA FC 24 Ultimate Team hile', features: ['Coin Generator', 'Player Unlock', 'Trade Bot'], prices: { day: 79, week: 249, month: 449 } },
            { id: 5, icon: '🎯', title: 'APEX LEGENDS CHEAT', desc: 'Apex Legends için profesyonel çözüm', features: ['ESP', 'Aimbot', 'Loot Radar'], prices: { day: 69, week: 199, month: 399 } },
            { id: 6, icon: '🌍', title: 'Rust CHEAT', desc: 'Rust oyunu için tam kapsamlı çözüm', features: ['ESP', 'Item ESP', 'Shoot Through Wall'], prices: { day: 99, week: 349, month: 549 } }
        ];

        const savedProducts = localStorage.getItem('matrixProducts');
        let adminProducts = savedProducts ? JSON.parse(savedProducts) : [...products];
        
        function openAdmin() {
        
        function closeAdmin() {
            document.getElementById('adminOverlay').classList.remove('active');
        }
        
        function showAdminSection(section) {
            document.querySelectorAll('.admin-nav-item').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(section).classList.add('active');
            
            const titles = {
                dashboard: 'Dashboard',
                products: 'Ürün Yönetimi',
                orders: 'Siparişler',
                users: 'Kullanıcılar'
            };
            document.querySelector('.admin-title').textContent = titles[section];
        }
        
        function loadAdminData() {
            document.getElementById('statOrders').textContent = '12';
            document.getElementById('statPending').textContent = '3';
            document.getElementById('statUsers').textContent = '156';
            document.getElementById('statRevenue').textContent = '₺12,450';
            
            renderProductsEdit();
            renderOrders();
            renderUsers();
        }
        
        function renderProductsEdit() {
            const container = document.getElementById('productsEditList');
            container.innerHTML = adminProducts.map((product, index) => `
                <div class="product-edit-card">
                    <div class="product-edit-header">
                        <div class="product-edit-title">${product.icon} ${product.title}</div>
                        <button class="action-btn danger" onclick="deleteProduct(${product.id})">🗑️ Sil</button>
                    </div>
                    <div class="form-row">
                        <div class="admin-form-group">
                            <label>İkon (Emoji)</label>
                            <input type="text" id="icon_${product.id}" value="${product.icon}" style="width: 60px; text-align: center; font-size: 1.5rem;">
                        </div>
                        <div class="admin-form-group">
                            <label>Başlık</label>
                            <input type="text" id="title_${product.id}" value="${product.title}">
                        </div>
                    </div>
                    <div class="admin-form-group">
                        <label>Açıklama</label>
                        <textarea id="desc_${product.id}">${product.desc}</textarea>
                    </div>
                    <div class="form-row-3">
                        <div class="admin-form-group">
                            <label>1 Gün Fiyatı (₺)</label>
                            <input type="number" id="price_day_${product.id}" value="${product.prices.day}">
                        </div>
                        <div class="admin-form-group">
                            <label>1 Hafta Fiyatı (₺)</label>
                            <input type="number" id="price_week_${product.id}" value="${product.prices.week}">
                        </div>
                        <div class="admin-form-group">
                            <label>1 Ay Fiyatı (₺)</label>
                            <input type="number" id="price_month_${product.id}" value="${product.prices.month}">
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function addNewProduct() {
            const newId = Math.max(...adminProducts.map(p => p.id)) + 1;
            const newProduct = {
                id: newId,
                icon: '🎮',
                image: '',
                title: 'YENİ ÜRÜN',
                desc: 'Ürün açıklaması',
                features: ['Özellik 1', 'Özellik 2'],
                prices: { day: 99, week: 249, month: 399 },
                systemReq: { os: 'Windows 10/11', processor: 'Intel Core i5', ram: '8GB', gpu: 'GTX 1050', storage: '500MB' }
            };
            adminProducts.push(newProduct);
            renderProductsEdit();
            showMessage('Yeni ürün eklendi! Düzenle ve kaydet.', 'success');
        }
        
        function deleteProduct(productId) {
            showConfirm('ÜRÜN SİL', 'Bu ürünü silmek istediğinizden emin misiniz?', () => {
                adminProducts = adminProducts.filter(p => p.id !== productId);
                renderProductsEdit();
            });
        }
        
        function saveAllProducts() {
            if (adminProducts.length === 0) {
                showMessage('Kaydedilecek ürün yok!', 'warning');
                return;
            }
            
            const updatedProducts = adminProducts.map(product => {
                const icon = document.getElementById(`icon_${product.id}`).value;
                const title = document.getElementById(`title_${product.id}`).value;
                const image = document.getElementById(`image_${product.id}`).value;
                const desc = document.getElementById(`desc_${product.id}`).value;
                const dayPrice = parseInt(document.getElementById(`price_day_${product.id}`).value) || 0;
                const weekPrice = parseInt(document.getElementById(`price_week_${product.id}`).value) || 0;
                const monthPrice = parseInt(document.getElementById(`price_month_${product.id}`).value) || 0;
                
                return {
                    ...product,
                    icon: icon,
                    title: title,
                    image: image,
                    desc: desc,
                    prices: { day: dayPrice, week: weekPrice, month: monthPrice }
                };
            });
            
            localStorage.setItem('matrixProducts', JSON.stringify(updatedProducts));
            adminProducts = updatedProducts;
            
            console.log('Kaydedilen ürünler:', adminProducts);
            showMessage(`${adminProducts.length} ürün başarıyla kaydedildi! Ana sayfayı yenileyerek değişiklikleri görebilirsin.`, 'success');
        }
        
        function renderOrders() {
            const mockOrders = [
                { id: 'ORD-001', product: 'VALORANT CHEAT', duration: '1 Ay', price: 299, status: 'pending', date: '08.05.2026', customer: 'test@example.com' },
                { id: 'ORD-002', product: 'CS2 CHEAT', duration: '1 Hafta', price: 179, status: 'completed', date: '07.05.2026', customer: 'user1@test.com' },
                { id: 'ORD-003', product: 'EA FC 24 CHEAT', duration: '1 Gün', price: 79, status: 'pending', date: '07.05.2026', customer: 'user2@test.com' },
                { id: 'ORD-004', product: 'Rust CHEAT', duration: '1 Ay', price: 549, status: 'cancelled', date: '06.05.2026', customer: 'user3@test.com' },
            ];
            
            const container = document.getElementById('ordersList');
            container.innerHTML = mockOrders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">${order.id}</span>
                        <span class="order-date">${order.date}</span>
                    </div>
                    <div class="order-details">
                        <div class="order-detail-item">
                            <label>Ürün</label>
                            <span>${order.product}</span>
                        </div>
                        <div class="order-detail-item">
                            <label>Paket</label>
                            <span>${order.duration}</span>
                        </div>
                        <div class="order-detail-item">
                            <label>Fiyat</label>
                            <span>₺${order.price}</span>
                        </div>
                    </div>
                    <div class="order-details">
                        <div class="order-detail-item">
                            <label>Müşteri</label>
                            <span>${order.customer}</span>
                        </div>
                        <div class="order-detail-item">
                            <label>Durum</label>
                            <span class="status-badge status-${order.status}">${order.status === 'pending' ? 'Beklemede' : order.status === 'completed' ? 'Tamamlandı' : 'İptal'}</span>
                        </div>
                    </div>
                    <div class="order-actions">
                        <button class="action-btn" onclick="updateOrder('${order.id}', 'completed')">✓ Tamamla</button>
                        <button class="action-btn" onclick="updateOrder('${order.id}', 'pending')">⏳ Beklemede</button>
                        <button class="action-btn danger" onclick="updateOrder('${order.id}', 'cancelled')">✕ İptal</button>
                    </div>
                </div>
            `).join('');
        }
        
        function updateOrder(orderId, status) {
            showMessage(`Sipariş ${orderId} durumu "${status}" olarak güncellendi`, 'success');
        }
        
        function renderUsers() {
            const mockUsers = [
                { email: 'admin@matrix.com', name: 'Admin', status: 'active', orders: 0 },
                { email: 'test@example.com', name: 'Test Kullanıcı', status: 'active', orders: 5 },
                { email: 'user1@test.com', name: 'Ahmet Yılmaz', status: 'active', orders: 12 },
                { email: 'user2@test.com', name: 'Mehmet Demir', status: 'inactive', orders: 2 },
            ];
            
            const container = document.getElementById('usersList');
            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>E-posta</th>
                            <th>İsim</th>
                            <th>Durum</th>
                            <th>Sipariş Sayısı</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${mockUsers.map(user => `
                            <tr>
                                <td>${user.email}</td>
                                <td>${user.name}</td>
                                <td><span class="status-badge status-${user.status === 'active' ? 'completed' : 'cancelled'}">${user.status === 'active' ? 'Aktif' : 'Pasif'}</span></td>
                                <td>${user.orders}</td>
                                <td>
                                    <button class="action-btn">Düzenle</button>
                                    <button class="action-btn danger">Sil</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        window.addEventListener('load', function() {
            openAdmin();
        });
        
        // Matrix Message System
        function showMessage(text, type = 'info', duration = 4000) {
            let container = document.querySelector('.matrix-message-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'matrix-message-container';
                document.body.appendChild(container);
            }
            const msg = document.createElement('div');
            msg.className = 'matrix-message ' + type;
            msg.innerHTML = text + '<span class="close-msg" onclick="this.parentElement.remove()">×</span>';
            container.appendChild(msg);
            if (duration > 0) setTimeout(() => msg.remove(), duration);
        }
        
        function showConfirm(title, message, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'matrix-confirm-overlay active';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:10001;';
            overlay.innerHTML = '<div style="background:#0a0a0a;border:2px solid #ff0040;padding:30px;max-width:400px;text-align:center;box-shadow:0 0 40px rgba(255,0,64,0.4);"><div style="font-size:3rem;color:#ff0040;margin-bottom:15px;">⚠️</div><div style="font-family:Orbitron,sans-serif;font-size:1.2rem;color:#ff0040;margin-bottom:15px;text-transform:uppercase;">' + title + '</div><div style="font-family:Share Tech Mono,monospace;color:#e0e0e0;margin-bottom:25px;">' + message + '</div><div style="display:flex;gap:15px;justify-content:center;"><button id="confirmYes" style="padding:12px 30px;background:#00ff41;border:none;color:#050505;font-family:Orbitron,sans-serif;cursor:pointer;">ONAYLA</button><button id="confirmNo" style="padding:12px 30px;background:transparent;border:1px solid #ff0040;color:#ff0040;font-family:Orbitron,sans-serif;cursor:pointer;">İPTAL</button></div></div>';
            document.body.appendChild(overlay);
            document.getElementById('confirmYes').onclick = () => { overlay.remove(); onConfirm(); };
            document.getElementById('confirmNo').onclick = () => overlay.remove();
        }
    </script>
</body>
</html>
